name: Release

# Runs when a tag like v0.2.0 is pushed. It checks the tag matches the
# version in manifest.json, zips the integration folder and attaches the zip
# to a GitHub release. HACS downloads that zip (see hacs.json).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/pulse_check/manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "Tag v$tag does not match manifest version $manifest" >&2
            exit 1
          fi
      - name: Build zip
        run: |
          cd custom_components/pulse_check
          zip -r ../../pulse_check.zip . -x '__pycache__/*' '*.pyc'
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: pulse_check.zip
          generate_release_notes: true

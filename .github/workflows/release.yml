name: Release

# Runs when a tag like v0.2.0 is pushed. It checks the tag matches the
# version in manifest.json, builds the card into the integration folder,
# zips that folder and attaches the zip to a GitHub release. HACS downloads
# that zip (see hacs.json), so one install brings the integration and card.
# The release notes are the version's section of CHANGELOG.md, which is
# also what HACS shows when it offers the update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/pulse_check/manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "Tag v$tag does not match manifest version $manifest" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # The newest Node 24, not whatever the runner has cached, so a
          # security release (such as 24.22.1 for CVE-2026-111497) is used
          # as soon as it is out.
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check and build the card
        working-directory: frontend
        run: |
          npm ci
          npm run check
          test -s ../custom_components/pulse_check/frontend/pulse-check-card.js
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/changelog.py "$GITHUB_REF_NAME" > release-notes.md
      - name: Build zip
        run: |
          cd custom_components/pulse_check
          zip -r ../../pulse_check.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
          unzip -l ../../pulse_check.zip | grep -q 'frontend/pulse-check-card.js'
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: pulse_check.zip
          body_path: release-notes.md

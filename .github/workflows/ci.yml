name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build single-file bundle
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: pulse-check-card
          path: dist/pulse-check-card.js

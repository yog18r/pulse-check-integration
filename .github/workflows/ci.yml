name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements_dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q

  frontend:
    name: Card (type-check, lint, format, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Type-check, lint, format check, tests, then the build, which writes
      # custom_components/pulse_check/frontend/pulse-check-card.js.
      - run: npm run check
      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: pulse-check-card
          path: custom_components/pulse_check/frontend/pulse-check-card.js
          if-no-files-found: error

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    # Validate the integration as it ships, with the built card inside.
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: pulse-check-card
          path: custom_components/pulse_check/frontend
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
